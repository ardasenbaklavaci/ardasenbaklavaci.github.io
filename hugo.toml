
baseURL = "https://ardasenbaklavaci.github.io/enthusiast-blog/"
languageCode = "tr"
title = "Enthusiast PC Blog"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true

[params]
  env = "production"
  title = "Enthusiast PC Blog"
  description = "Hardware Reviews, Testing and PC Enthusiast Guides"
  defaultTheme = "dark"
  showReadingTime = true
  showShareButtons = true
  showCodeCopyButtons = true

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]